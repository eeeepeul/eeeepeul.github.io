<html lang="ko" data-theme="light">
<head>

<title>Atlantic Point Relief</title>

<style>
/* Layout: one flat relief plate centred on the page, flipping front to back; a hairline caption at the foot. */
:root{--bg:#cbcbcb;--ink:#0b0b0a;--ink-soft:#8d8d86;--ink-faint:#bdbdb6;--ui:#0b0b0a;--font:"Space Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0c;--ink:#f1f1ea;--ink-soft:#8a8a83;--ink-faint:#4a4a46;--ui:#f1f1ea;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d0c;--ink:#f1f1ea;--ink-soft:#8a8a83;--ink-faint:#4a4a46;--ui:#f1f1ea;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ui);font-family:var(--font);overflow:hidden;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#stage{position:absolute;inset:0;cursor:grab;touch-action:none}
#stage:active{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
.bar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
.bar span{color:var(--ink-soft)}
button{pointer-events:auto;font:inherit;letter-spacing:inherit;text-transform:inherit;background:none;color:var(--ui);border:1px solid var(--ink-faint);padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ui)}
button:focus-visible{outline:2px solid var(--ui);outline-offset:2px}
/* In the stage only the picture is wanted: no caption, no button. */
.bar{display:none}
</style>

    add(x0*(1+dr*.2)+(rnd()-.5)*.03,y0*(1+dr*.2)+(rnd()-.5)*.03,zs+(rnd()<.5?-d:d),s*(.8+.4*rnd()),s*(.8+.5*rnd()));
  }
  // each dot is a square that always faces the viewer, so it stays a crisp square when the sheet is turned
  // centre the sheet on the turning axis, so it spins in place instead of swinging round it
  {let sx=0,sz=0;const n=P.length/5;for(let i=0;i<n;i++){sx+=P[5*i];sz+=P[5*i+2]}
   const cx=sx/n,cz=sz/n;for(let i=0;i<n;i++){P[5*i]-=cx;P[5*i+2]-=cz}}
  const N=P.length/5,pos=new Float32Array(N*12),cor=new Float32Array(N*8),sz=new Float32Array(N*8),idx=new Uint32Array(N*6);
  const C=[-1,-1,1,-1,1,1,-1,1];
  for(let i=0;i<N;i++){
    for(let c=0;c<4;c++){
      pos.set([P[5*i],P[5*i+1],P[5*i+2]],i*12+c*3);cor.set([C[2*c],C[2*c+1]],i*8+c*2);sz.set([P[5*i+3],P[5*i+4]],i*8+c*2);
    }
    idx.set([4*i,4*i+1,4*i+2,4*i,4*i+2,4*i+3],i*6);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aCorner',new THREE.BufferAttribute(cor,2));
  geo.setAttribute('aSize',new THREE.BufferAttribute(sz,2));
  geo.setIndex(new THREE.BufferAttribute(idx,1));
  const mat=new THREE.ShaderMaterial({uniforms:{uColor:{value:new THREE.Color(0)}},side:THREE.DoubleSide,
    vertexShader:'attribute vec2 aCorner;attribute vec2 aSize;void main(){vec4 mv=modelViewMatrix*vec4(position,1.0);mv.xy+=aCorner*aSize*0.5;gl_Position=projectionMatrix*mv;}',
    fragmentShader:'uniform vec3 uColor;void main(){gl_FragColor=vec4(uColor,1.0);}'});
  const mesh=new THREE.Mesh(geo,mat);mesh.frustumCulled=false;return mesh;
}
const faces=[face(1)];   // one sheet only; seen from behind it reads mirrored
faces.forEach(f=>plate.add(f));
function theme(){
  const ink=new THREE.Color(css('--ink'));
  faces.forEach(f=>f.material.uniforms.uColor.value.copy(ink));
}
theme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

function size(){
  const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;
  const s=Math.min(w,h);cam.fov=2*Math.atan(0.1885*(h/s)/0.84)/D;cam.updateProjectionMatrix();
}
addEventListener('resize',size);size();

// the plate turns slowly, always in the same direction (about 26 seconds a turn); drag to turn it by hand
const SPEED=14;
let angle=0,last=performance.now(),spinning=true,drag=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const coord=document.getElementById('coord'),btn=document.getElementById('flip');
if(reduce){spinning=false;btn.textContent='Spin off';btn.setAttribute('aria-pressed','false')}
btn.onclick=()=>{spinning=!spinning;btn.textContent=spinning?'Spin on':'Spin off';btn.setAttribute('aria-pressed',String(spinning))};
stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,a:angle};stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(drag)angle=drag.a+(e.clientX-drag.x)*.4});
const end=()=>{drag=null};
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(spinning&&!drag)angle+=SPEED*dt;
  plate.rotation.y=angle*D;
  plate.rotation.x=reduce?0:.16*Math.sin(now/2300);
  const a=((angle%360)+360)%360;
  coord.textContent=((a<90||a>=270)?'FRONT ':'BACK ')+Math.round(a)+'°';
  renderer.render(scene,cam);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
